name: Desktop spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/desktop-spike.yml
      - client/**
      - cmd/scimtest-desktop/**
      - internal/client/**
      - internal/protocol/**
      - internal/server/**
      - internal/web/**
      - packaging/macos/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  build:
    name: scimtest-desktop-darwin-arm64
    runs-on: macos-26
    env:
      CGO_ENABLED: 1
      GOARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Sparkle
        run: ./packaging/macos/fetch-sparkle.sh
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/build/sparkle
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build dist
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Package macOS preview app
        shell: bash
        run: |
          ./packaging/macos/build-app.sh \
            build/scimtest-desktop \
            build \
            0.0.0 \
            "${GITHUB_RUN_NUMBER}"
          ./packaging/macos/sign-app.sh build/scimtest.app -
          codesign --verify --deep --strict --verbose=2 build/scimtest.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/scimtest.app \
            dist/scimtest-desktop-darwin-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-darwin-arm64
          path: dist/scimtest-desktop-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 14
