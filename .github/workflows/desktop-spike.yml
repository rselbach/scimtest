name: Desktop spike

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/desktop-spike.yml
      - client/**
      - cmd/scimtest-desktop/**
      - internal/client/**
      - internal/protocol/**
      - internal/server/**
      - internal/web/**
      - packaging/linux/**
      - packaging/macos/**
      - go.mod
      - go.sum

permissions:
  contents: read

jobs:
  build:
    name: scimtest-desktop-darwin-arm64
    runs-on: macos-26
    env:
      CGO_ENABLED: 1
      GOARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Sparkle
        run: ./packaging/macos/fetch-sparkle.sh
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/build/sparkle
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build dist
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Package macOS preview app
        shell: bash
        run: |
          ./packaging/macos/build-app.sh \
            build/scimtest-desktop \
            build \
            0.0.0 \
            "${GITHUB_RUN_NUMBER}"
          ./packaging/macos/sign-app.sh build/scimtest.app -
          codesign --verify --deep --strict --verbose=2 build/scimtest.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/scimtest.app \
            dist/scimtest-desktop-darwin-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-darwin-arm64
          path: dist/scimtest-desktop-darwin-arm64.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: scimtest-desktop-linux-amd64
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 1
      PKG_CONFIG: ${{ github.workspace }}/packaging/linux/pkg-config-webkit2gtk-4.1.sh
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xdotool \
            xvfb
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build dist
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Package Linux preview
        run: |
          ./packaging/linux/build-deb.sh \
            build/scimtest-desktop \
            dist/scimtest-desktop_0.0.0_linux_amd64.deb \
            0.0.0 \
            amd64
          dpkg-deb --info dist/scimtest-desktop_0.0.0_linux_amd64.deb
          dpkg-deb --contents dist/scimtest-desktop_0.0.0_linux_amd64.deb
      - name: Install preview package
        run: sudo apt-get install -y ./dist/scimtest-desktop_0.0.0_linux_amd64.deb
      - name: Smoke-test installed desktop app
        run: xvfb-run -a ./packaging/linux/smoke-test.sh /usr/bin/scimtest-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-linux-amd64
          path: dist/scimtest-desktop_0.0.0_linux_amd64.deb
          if-no-files-found: error
          retention-days: 14

  build-linux-native:
    name: scimtest-desktop-linux-${{ matrix.package }}-x86_64
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: rpm
            container: fedora:44
          - package: arch
            container: archlinux:base-devel
    env:
      CGO_ENABLED: 1
      PKG_CONFIG: ${{ github.workspace }}/packaging/linux/pkg-config-webkit2gtk-4.1.sh
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - name: Install Fedora build dependencies
        if: matrix.package == 'rpm'
        run: |
          dnf install -y \
            gcc-c++ \
            git \
            gtk3-devel \
            pkgconf-pkg-config \
            rpm-build \
            webkit2gtk4.1-devel \
            xdotool \
            xorg-x11-server-Xvfb
      - name: Install Arch build dependencies
        if: matrix.package == 'arch'
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            gtk3 \
            webkit2gtk-4.1 \
            xdotool \
            xorg-server-xvfb \
            xorg-xauth
      - uses: actions/checkout@v7
      - name: Trust container checkout
        run: git config --global --add safe.directory "$(pwd)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build dist
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Package RPM
        if: matrix.package == 'rpm'
        run: |
          ./packaging/linux/build-rpm.sh \
            build/scimtest-desktop \
            dist/scimtest-desktop_0.0.0_linux_x86_64.rpm \
            0.0.0 \
            amd64
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          dnf install -y dist/*.rpm
      - name: Package Arch Linux
        if: matrix.package == 'arch'
        run: |
          package_path="dist/scimtest-desktop_0.0.0_linux_x86_64.pkg.tar.zst"
          useradd --create-home package-builder
          chown -R package-builder:package-builder build dist
          runuser -u package-builder -- \
            ./packaging/linux/build-arch-package.sh \
              build/scimtest-desktop \
              "${package_path}" \
              0.0.0 \
              amd64
          pacman -Qip "${package_path}"
          pacman -Qlp "${package_path}"
          pacman -U --noconfirm "${package_path}"
      - name: Smoke-test installed desktop app
        run: xvfb-run -a ./packaging/linux/smoke-test.sh /usr/bin/scimtest-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-linux-${{ matrix.package }}-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
