name: Release

on:
  push:
    branches:
      - spike/desktop-app
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in preview desktop artifacts
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '0.0.0' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  release-notes:
    name: Generate release notes
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate tagged release notes
        if: startsWith(github.ref, 'refs/tags/v')
        uses: rselbach/actions/pi-release-notes@pi-release-notes-v1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          project-name: scimtest
          project-description: Local identity provider and SCIM client for testing OIDC, SAML, and SCIM integrations.
          output-file: build/release-notes.md
      - name: Write preview release notes
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          mkdir -p build
          printf '# scimtest %s\n\nDevelopment preview build.\n' \
            "${RELEASE_VERSION}" > build/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-release-notes
          path: build/release-notes.md
          if-no-files-found: error
          retention-days: 7

  build-desktop:
    name: Desktop arm64
    runs-on: macos-26
    env:
      CGO_ENABLED: 1
      GOARCH: arm64
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch Sparkle
        run: ./packaging/macos/fetch-sparkle.sh
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/build/sparkle
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
          file build/scimtest-desktop
          vtool -show-build build/scimtest-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-arm64
          path: build/scimtest-desktop
          if-no-files-found: error
          retention-days: 7

  package-desktop-linux:
    name: Package Linux desktop app
    needs:
      - test
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 1
      PKG_CONFIG: ${{ github.workspace }}/packaging/linux/pkg-config-webkit2gtk-4.1.sh
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xdotool \
            xvfb
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build release
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Package Linux desktop app
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          package_path="release/scimtest-desktop_${version}_linux_amd64.deb"
          ./packaging/linux/build-deb.sh \
            build/scimtest-desktop \
            "${package_path}" \
            "${version}" \
            amd64
          dpkg-deb --info "${package_path}"
          dpkg-deb --contents "${package_path}"
          sha256sum "${package_path}" \
            >"release/scimtest-desktop_${version}_linux_amd64_checksums.txt"
      - name: Install Linux desktop app
        run: sudo apt-get install -y ./release/*.deb
      - name: Smoke-test installed desktop app
        run: xvfb-run -a ./packaging/linux/smoke-test.sh /usr/bin/scimtest-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-linux-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  package-desktop-linux-native:
    name: Package Linux desktop app (${{ matrix.package }})
    needs:
      - test
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: rpm
            container: fedora:44
          - package: arch
            container: archlinux:base-devel
    env:
      CGO_ENABLED: 1
      PKG_CONFIG: ${{ github.workspace }}/packaging/linux/pkg-config-webkit2gtk-4.1.sh
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - name: Install Fedora build dependencies
        if: matrix.package == 'rpm'
        run: |
          dnf install -y \
            gcc-c++ \
            git \
            gtk3-devel \
            pkgconf-pkg-config \
            rpm-build \
            webkit2gtk4.1-devel \
            xdotool \
            xorg-x11-server-Xvfb
      - name: Install Arch build dependencies
        if: matrix.package == 'arch'
        run: |
          pacman -Syu --noconfirm \
            base-devel \
            git \
            gtk3 \
            webkit2gtk-4.1 \
            xdotool \
            xorg-server-xvfb \
            xorg-xauth
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build release
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Package RPM
        if: matrix.package == 'rpm'
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          package_path="release/scimtest-desktop_${version}_linux_x86_64.rpm"
          ./packaging/linux/build-rpm.sh \
            build/scimtest-desktop \
            "${package_path}" \
            "${version}" \
            amd64
          rpm -qip "${package_path}"
          rpm -qlp "${package_path}"
          sha256sum "${package_path}" \
            >"release/scimtest-desktop_${version}_linux_x86_64_rpm_checksums.txt"
          dnf install -y "${package_path}"
      - name: Package Arch Linux
        if: matrix.package == 'arch'
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          package_path="release/scimtest-desktop_${version}_linux_x86_64.pkg.tar.zst"
          useradd --create-home package-builder
          chown -R package-builder:package-builder build release
          runuser -u package-builder -- \
            ./packaging/linux/build-arch-package.sh \
              build/scimtest-desktop \
              "${package_path}" \
              "${version}" \
              amd64
          pacman -Qip "${package_path}"
          pacman -Qlp "${package_path}"
          sha256sum "${package_path}" \
            >"release/scimtest-desktop_${version}_linux_x86_64_arch_checksums.txt"
          pacman -U --noconfirm "${package_path}"
      - name: Smoke-test installed desktop app
        run: xvfb-run -a ./packaging/linux/smoke-test.sh /usr/bin/scimtest-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-linux-${{ matrix.package }}-release
          path: release/*
          if-no-files-found: error
          retention-days: 7

  package-server-preview:
    name: Package server release preview
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Package server artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-server-release
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  package-desktop:
    name: Sign and notarize desktop app
    needs:
      - test
      - build-desktop
      - release-notes
    runs-on: macos-26
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Fetch Sparkle
        run: ./packaging/macos/fetch-sparkle.sh
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-arm64
          path: build/arm64
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-release-notes
          path: build
      - name: Install signing credentials
        shell: bash
        run: |
          set -o pipefail
          required=(
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_ID
            APPLE_TEAM_ID
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the ${name} repository secret"
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" \
            | base64 --decode >"${certificate_path}"

          security create-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          signing_identity="$(security find-identity \
            -v -p codesigning "${keychain_path}" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ ! "${signing_identity}" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::The PKCS #12 file contains no Developer ID Application identity"
            exit 1
          fi

          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >>"${GITHUB_ENV}"
          echo "MACOS_SIGNING_IDENTITY=${signing_identity}" >>"${GITHUB_ENV}"
      - name: Assemble arm64 app
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p package release notarization
          architectures="$(lipo -archs build/arm64/scimtest-desktop)"
          if [[ "${architectures}" != "arm64" ]]; then
            echo "::error::Desktop binary must contain only arm64"
            exit 1
          fi
          vtool -show-build build/arm64/scimtest-desktop
          minos_count="$(vtool -show-build build/arm64/scimtest-desktop \
            | awk '$1 == "minos" && $2 == "26.0" { count++ } END { print count + 0 }')"
          if (( minos_count != 1 )); then
            echo "::error::The arm64 Mach-O slice must target macOS 26.0"
            exit 1
          fi
          ./packaging/macos/build-app.sh \
            build/arm64/scimtest-desktop \
            package \
            "${version}" \
            "${GITHUB_RUN_NUMBER}" \
            build/release-notes.md
      - name: Sign application
        shell: bash
        run: |
          ./packaging/macos/sign-app.sh \
            package/scimtest.app \
            "${MACOS_SIGNING_IDENTITY}" \
            --timestamp
          codesign --verify --deep --strict --verbose=2 package/scimtest.app
      - name: Notarize application
        shell: bash
        run: |
          ditto -c -k --keepParent \
            package/scimtest.app \
            notarization/scimtest-app-submission.zip
          ./packaging/macos/notarize.sh \
            notarization/scimtest-app-submission.zip \
            notarization/scimtest-app.json
          xcrun stapler staple package/scimtest.app
          xcrun stapler validate package/scimtest.app
          spctl --assess --type execute --verbose=4 package/scimtest.app
      - name: Create and notarize release artifacts
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          zip_path="release/scimtest-desktop_${version}_arm64.zip"
          dmg_path="release/scimtest-desktop_${version}_arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            package/scimtest.app \
            "${zip_path}"
          ./packaging/macos/create-dmg.sh package/scimtest.app "${dmg_path}"
          codesign --force \
            --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${dmg_path}"
          ./packaging/macos/notarize.sh \
            "${dmg_path}" \
            notarization/scimtest-dmg.json
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          codesign --verify --verbose=2 "${dmg_path}"

          checksum_path="release/scimtest-desktop_${version}_checksums.txt"
          (
            cd release
            shasum -a 256 \
              "$(basename "${dmg_path}")" \
              "$(basename "${zip_path}")"
          ) >"${checksum_path}"
      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -o pipefail
          if [[ -z "${SPARKLE_EDDSA_PRIVATE_KEY}" ]]; then
            echo "::error::Set the SPARKLE_EDDSA_PRIVATE_KEY repository secret"
            exit 1
          fi

          version="${RELEASE_VERSION#v}"
          archive_name="scimtest-desktop_${version}_arm64.zip"
          mkdir -p appcast-input appcast-site
          cp "release/${archive_name}" appcast-input/
          printf '%s' "${SPARKLE_EDDSA_PRIVATE_KEY}" \
            | build/sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix \
              "https://github.com/rselbach/scimtest/releases/download/v${version}/" \
              --link "https://github.com/rselbach/scimtest" \
              -o "${GITHUB_WORKSPACE}/appcast-site/appcast.xml" \
              appcast-input
          xmllint --noout appcast-site/appcast.xml
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-release
          path: release/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload appcast for GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-pages-artifact@v5
        with:
          path: appcast-site
      - name: Upload notarization logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-notarization
          path: notarization/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" && -f "${MACOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${MACOS_KEYCHAIN_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12"

  release-server:
    name: Publish server release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-notes
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-release-notes
          path: build
      - name: Publish server release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes build/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-desktop:
    name: Publish desktop release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-desktop
      - package-desktop-linux
      - package-desktop-linux-native
      - release-server
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-release
          path: ${{ runner.temp }}/desktop-release
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-linux-release
          path: ${{ runner.temp }}/desktop-release
      - uses: actions/download-artifact@v7
        with:
          pattern: scimtest-desktop-linux-*-release
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Publish desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${RUNNER_TEMP}"/desktop-release/* --clobber
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg_path="${RUNNER_TEMP}/desktop-release/scimtest-desktop_${version}_arm64.dmg"
          dmg_sha256="$(sha256sum "${dmg_path}" | cut -d ' ' -f 1)"
          ./packaging/macos/update-homebrew-cask.sh \
            "${version}" \
            "${dmg_sha256}"

  deploy-appcast:
    name: Publish Sparkle appcast
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-desktop
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy appcast
        id: deployment
        uses: actions/deploy-pages@v5
