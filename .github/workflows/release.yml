name: Release

on:
  push:
    branches:
      - spike/desktop-app
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in preview desktop artifacts
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '0.0.0' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build-desktop:
    name: Desktop ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: amd64
    runs-on: ${{ matrix.runner }}
    env:
      CGO_ENABLED: 1
      GOARCH: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check desktop application profile
        shell: bash
        run: |
          if [[ ! "${SCIMTEST_APPLICATION_PROFILE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
            echo "::error::Set SCIMTEST_APPLICATION_PROFILE_ID to the application profile ID"
            exit 1
          fi
      - name: Test desktop shell
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        shell: bash
        run: |
          mkdir -p build
          go build -tags desktop -trimpath \
            -ldflags="-s -w -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=${SCIMTEST_APPLICATION_PROFILE_ID} -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
          file build/scimtest-desktop
          vtool -show-build build/scimtest-desktop
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-${{ matrix.arch }}
          path: build/scimtest-desktop
          if-no-files-found: error
          retention-days: 7

  package-server-preview:
    name: Package server release preview
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Package server artifacts
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-server-release
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 7

  package-desktop:
    name: Sign and notarize desktop app
    needs:
      - test
      - build-desktop
    runs-on: macos-26
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-arm64
          path: build/arm64
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-amd64
          path: build/amd64
      - name: Install signing credentials
        shell: bash
        run: |
          set -o pipefail
          required=(
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_ID
            APPLE_TEAM_ID
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the ${name} repository secret"
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" \
            | base64 --decode >"${certificate_path}"

          security create-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          signing_identity="$(security find-identity \
            -v -p codesigning "${keychain_path}" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ ! "${signing_identity}" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::The PKCS #12 file contains no Developer ID Application identity"
            exit 1
          fi

          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >>"${GITHUB_ENV}"
          echo "MACOS_SIGNING_IDENTITY=${signing_identity}" >>"${GITHUB_ENV}"
      - name: Assemble universal app
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p build/universal package release notarization
          lipo -create \
            build/arm64/scimtest-desktop \
            build/amd64/scimtest-desktop \
            -output build/universal/scimtest-desktop
          lipo build/universal/scimtest-desktop -verify_arch arm64 x86_64
          vtool -show-build build/universal/scimtest-desktop
          minos_count="$(vtool -show-build build/universal/scimtest-desktop \
            | awk '$1 == "minos" && $2 == "26.0" { count++ } END { print count + 0 }')"
          if (( minos_count != 2 )); then
            echo "::error::Both Mach-O slices must target macOS 26.0"
            exit 1
          fi
          ./packaging/macos/build-app.sh \
            build/universal/scimtest-desktop \
            package \
            "${version}" \
            "${GITHUB_RUN_NUMBER}"
      - name: Sign application
        shell: bash
        run: |
          codesign --force \
            --options runtime \
            --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            package/scimtest.app
          codesign --verify --deep --strict --verbose=2 package/scimtest.app
      - name: Notarize application
        shell: bash
        run: |
          ditto -c -k --keepParent \
            package/scimtest.app \
            notarization/scimtest-app-submission.zip
          ./packaging/macos/notarize.sh \
            notarization/scimtest-app-submission.zip \
            notarization/scimtest-app.json
          xcrun stapler staple package/scimtest.app
          xcrun stapler validate package/scimtest.app
          spctl --assess --type execute --verbose=4 package/scimtest.app
      - name: Create and notarize release artifacts
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          zip_path="release/scimtest-desktop_${version}_universal.zip"
          dmg_path="release/scimtest-desktop_${version}_universal.dmg"

          ditto -c -k --keepParent package/scimtest.app "${zip_path}"
          ./packaging/macos/create-dmg.sh package/scimtest.app "${dmg_path}"
          codesign --force \
            --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${dmg_path}"
          ./packaging/macos/notarize.sh \
            "${dmg_path}" \
            notarization/scimtest-dmg.json
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          codesign --verify --verbose=2 "${dmg_path}"

          checksum_path="release/scimtest-desktop_${version}_checksums.txt"
          shasum -a 256 "${dmg_path}" "${zip_path}" >"${checksum_path}"
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-release
          path: release/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload notarization logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-notarization
          path: notarization/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" && -f "${MACOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${MACOS_KEYCHAIN_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12"

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-desktop
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-release
          path: desktop-release
      - name: Publish server release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" desktop-release/* --clobber
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg_path="desktop-release/scimtest-desktop_${version}_universal.dmg"
          dmg_sha256="$(sha256sum "${dmg_path}" | cut -d ' ' -f 1)"
          ./packaging/macos/update-homebrew-cask.sh \
            "${version}" \
            "${dmg_sha256}"
