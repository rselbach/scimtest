name: Release

on:
  push:
    branches: [spike/desktop-app]
    tags: [v*]
  workflow_dispatch:
    inputs:
      version:
        description: Numeric beta version (0.0.0 disables the beta's updater)
        required: true
        default: "0.0.0"
        type: string

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version || '0.0.0' }}

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Validate desktop version
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Use one to three numeric version components, such as 0.0.0"
            exit 1
          fi
      - name: Check Rust services and release tooling
        run: |
          cargo fmt --all -- --check
          cargo clippy -p scimtest-core -p scimtest-server -p scimtest-protocol -p scimtest-update-tool --all-targets --locked -- -D warnings
          cargo test -p scimtest-core -p scimtest-server -p scimtest-protocol -p scimtest-update-tool --locked
  release-notes:
    name: Generate release notes
    needs:
      - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate tagged release notes
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: rselbach/actions/pi-release-notes@pi-release-notes-v1
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        with:
          project-name: scimtest
          project-description: Local identity provider and SCIM client for testing OIDC, SAML, and SCIM integrations.
          output-file: build/release-notes.md
      - name: Write preview release notes
        if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p build
          printf '# scimtest %s\n\nDevelopment Rust beta.\n\nCommit: %s\nBuild: %s\n' \
            "${RELEASE_VERSION}" \
            "${GITHUB_SHA}" "${GITHUB_RUN_NUMBER}" > build/release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-release-notes
          path: build/release-notes.md
          if-no-files-found: error
          retention-days: 7
  build-desktop:
    name: Desktop arm64
    runs-on: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: "26.0"
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GPUI executable
        run: ./packaging/rust/build-desktop.sh build/scimtest-desktop "${RELEASE_VERSION#v}" macos
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-arm64
          path: build/scimtest-desktop
          if-no-files-found: error
          retention-days: 7

  package-desktop-linux:
    name: Linux desktop (${{ matrix.kind }})
    needs: [test]
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: deb
            container: ubuntu:24.04
            artifact: scimtest-desktop-linux-release
          - kind: rpm
            container: fedora:44
            artifact: scimtest-desktop-linux-rpm-release
          - kind: pkg.tar.zst
            container: archlinux:base-devel
            artifact: scimtest-desktop-linux-arch-release
    env:
      SCIMTEST_APPLICATION_PROFILE_ID: ${{ vars.SCIMTEST_APPLICATION_PROFILE_ID }}
      PACKAGE_KIND: ${{ matrix.kind }}
    steps:
      - uses: actions/checkout@v7
      - name: Install GPUI and packaging dependencies
        run: ./packaging/rust/install-linux-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build GPUI executable
        run: ./packaging/rust/build-desktop.sh build/scimtest-desktop "${RELEASE_VERSION#v}" "${PACKAGE_KIND}"
      - name: Package and install Debian app
        if: matrix.kind == 'deb'
        run: |
          mkdir -p release
          package="release/scimtest-desktop_${RELEASE_VERSION#v}_linux_amd64.deb"
          ./packaging/linux/build-deb.sh build/scimtest-desktop "${package}" "${RELEASE_VERSION#v}" amd64
          apt-get install -y "./${package}"
      - name: Package and install Fedora app
        if: matrix.kind == 'rpm'
        run: |
          mkdir -p release
          package="release/scimtest-desktop_${RELEASE_VERSION#v}_linux_x86_64.rpm"
          ./packaging/linux/build-rpm.sh build/scimtest-desktop "${package}" "${RELEASE_VERSION#v}" amd64
          dnf install -y "${package}"
      - name: Package and install Arch app
        if: matrix.kind == 'pkg.tar.zst'
        run: |
          mkdir -p release
          useradd --create-home package-builder
          chown -R package-builder:package-builder build release
          package="release/scimtest-desktop_${RELEASE_VERSION#v}_linux_x86_64.pkg.tar.zst"
          runuser -u package-builder -- ./packaging/linux/build-arch-package.sh build/scimtest-desktop "${package}" "${RELEASE_VERSION#v}" amd64
          pacman -U --noconfirm "${package}"
      - name: Write package checksums
        run: |
          (cd release && sha256sum ./*) > checksums.txt
          mv checksums.txt "release/scimtest-desktop_${RELEASE_VERSION#v}_${PACKAGE_KIND}_checksums.txt"
      - name: Smoke-test installed GPUI app
        run: dbus-run-session -- xvfb-run -a python3 packaging/rust/smoke-test.py /usr/bin/scimtest-desktop --expect-account
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  build-server:
    name: Server (${{ matrix.platform }}/${{ matrix.arch }})
    needs: [test]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            target: aarch64-unknown-linux-musl
          - runner: macos-26
            platform: darwin
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-26
            platform: darwin
            arch: amd64
            target: x86_64-apple-darwin
    env:
      SERVER_TARGET: ${{ matrix.target }}
      SERVER_PLATFORM: ${{ matrix.platform }}
      SERVER_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          target_key="$(printf '%s' "${SERVER_TARGET}" | tr '[:lower:]-' '[:upper:]_')"
          cc_target="${SERVER_TARGET//-/_}"
          echo "CARGO_TARGET_${target_key}_LINKER=musl-gcc" >>"${GITHUB_ENV}"
          echo "CC_${cc_target}=musl-gcc" >>"${GITHUB_ENV}"
      - name: Build and package Rust server
        run: |
          cargo build --locked --release --target "${SERVER_TARGET}" -p scimtest-server
          ./packaging/rust/package-server.sh "target/${SERVER_TARGET}/release/scimtest-server" dist "${RELEASE_VERSION#v}" "${SERVER_PLATFORM}" "${SERVER_ARCH}"
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-server-${{ matrix.platform }}-${{ matrix.arch }}-release
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  package-server:
    name: Collect server archives
    needs: [build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: scimtest-server-*-release
          path: dist
          merge-multiple: true
      - name: Write server checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-server-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  package-desktop:
    name: Sign and notarize desktop app
    needs:
      - test
      - build-desktop
      - release-notes
    runs-on: macos-26
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-arm64
          path: build/arm64
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-release-notes
          path: build
      - name: Install signing credentials
        shell: bash
        run: |
          set -o pipefail
          required=(
            APPLE_APP_SPECIFIC_PASSWORD
            APPLE_ID
            APPLE_TEAM_ID
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Set the ${name} repository secret"
              exit 1
            fi
          done

          certificate_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "${MACOS_CERTIFICATE_P12_BASE64}" \
            | base64 --decode >"${certificate_path}"

          security create-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${keychain_password}" \
            "${keychain_path}"
          security import "${certificate_path}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${keychain_path}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}"
          signing_identity="$(security find-identity \
            -v -p codesigning "${keychain_path}" \
            | awk '/Developer ID Application/ { print $2; exit }')"
          if [[ ! "${signing_identity}" =~ ^[[:xdigit:]]{40}$ ]]; then
            echo "::error::The PKCS #12 file contains no Developer ID Application identity"
            exit 1
          fi

          echo "MACOS_KEYCHAIN_PATH=${keychain_path}" >>"${GITHUB_ENV}"
          echo "MACOS_SIGNING_IDENTITY=${signing_identity}" >>"${GITHUB_ENV}"
      - name: Assemble arm64 app
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          mkdir -p package release notarization
          architectures="$(lipo -archs build/arm64/scimtest-desktop)"
          if [[ "${architectures}" != "arm64" ]]; then
            echo "::error::Desktop binary must contain only arm64"
            exit 1
          fi
          vtool -show-build build/arm64/scimtest-desktop
          minos_count="$(vtool -show-build build/arm64/scimtest-desktop \
            | awk '$1 == "minos" && $2 == "26.0" { count++ } END { print count + 0 }')"
          if (( minos_count != 1 )); then
            echo "::error::The arm64 Mach-O slice must target macOS 26.0"
            exit 1
          fi
          ./packaging/macos/build-app.sh \
            build/arm64/scimtest-desktop \
            package \
            "${version}" \
            "${GITHUB_RUN_NUMBER}" \
            build/release-notes.md
      - name: Sign application
        shell: bash
        run: |
          ./packaging/macos/sign-app.sh \
            package/scimtest.app \
            "${MACOS_SIGNING_IDENTITY}" \
            --timestamp
          codesign --verify --deep --strict --verbose=2 package/scimtest.app
      - name: Smoke-test signed Rust application
        run: python3 packaging/rust/smoke-test.py package/scimtest.app/Contents/MacOS/scimtest --expect-account
      - name: Notarize application
        shell: bash
        run: |
          ditto -c -k --keepParent \
            package/scimtest.app \
            notarization/scimtest-app-submission.zip
          ./packaging/macos/notarize.sh \
            notarization/scimtest-app-submission.zip \
            notarization/scimtest-app.json
          xcrun stapler staple package/scimtest.app
          xcrun stapler validate package/scimtest.app
          spctl --assess --type execute --verbose=4 package/scimtest.app
          # the updater installs only apps that satisfy this requirement
          codesign --verify --deep --strict \
            -R="$(cat packaging/macos/update-requirement.txt)" \
            package/scimtest.app
      - name: Create and notarize release artifacts
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          zip_path="release/scimtest-desktop_${version}_arm64.zip"
          dmg_path="release/scimtest-desktop_${version}_arm64.dmg"

          ditto -c -k --sequesterRsrc --keepParent \
            package/scimtest.app \
            "${zip_path}"
          ./packaging/macos/create-dmg.sh package/scimtest.app "${dmg_path}"
          codesign --force \
            --timestamp \
            --sign "${MACOS_SIGNING_IDENTITY}" \
            "${dmg_path}"
          ./packaging/macos/notarize.sh \
            "${dmg_path}" \
            notarization/scimtest-dmg.json
          xcrun stapler staple "${dmg_path}"
          xcrun stapler validate "${dmg_path}"
          codesign --verify --verbose=2 "${dmg_path}"

          checksum_path="release/scimtest-desktop_${version}_checksums.txt"
          (
            cd release
            shasum -a 256 \
              "$(basename "${dmg_path}")" \
              "$(basename "${zip_path}")"
          ) >"${checksum_path}"
      - uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-release
          path: release/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload notarization logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scimtest-desktop-notarization
          path: notarization/*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          if [[ -n "${MACOS_KEYCHAIN_PATH:-}" && -f "${MACOS_KEYCHAIN_PATH}" ]]; then
            security delete-keychain "${MACOS_KEYCHAIN_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/developer-id.p12"
  beta-summary:
    name: Manual beta downloads
    if: github.event_name == 'workflow_dispatch'
    needs:
      - package-desktop
      - package-desktop-linux
    runs-on: ubuntu-latest
    steps:
      - name: Describe beta artifacts
        shell: bash
        run: |
          {
            printf '## Manual Rust beta\n\n'
            printf 'Version: **%s** · build: **%s**\n\n' \
              "${RELEASE_VERSION}" "${GITHUB_RUN_NUMBER}"
            printf 'Source: [%s](%s/%s/commit/%s)\n\n' \
              "${GITHUB_SHA}" "${GITHUB_SERVER_URL}" \
              "${GITHUB_REPOSITORY}" "${GITHUB_SHA}"
            printf 'Download artifacts from this run within seven days:\n\n'
            printf -- '- **scimtest-desktop-release**: signed, notarized macOS ZIP, DMG and checksums.\n'
            printf -- '- **scimtest-desktop-linux-release**: Debian package and checksums.\n'
            printf -- '- **scimtest-desktop-linux-rpm-release**: Fedora RPM and checksums.\n'
            printf -- '- **scimtest-desktop-linux-arch-release**: Arch package and checksums.\n\n'
            printf 'This beta is available by manual download only. It is not offered as an automatic update.\n'
          } >>"${GITHUB_STEP_SUMMARY}"
  release-server:
    name: Publish server release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release-notes, package-server]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-release-notes
          path: build
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-server-release
          path: dist
      - name: Publish Rust server archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file build/release-notes.md
  release-desktop:
    name: Publish desktop release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - package-desktop
      - package-desktop-linux
      - release-server
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-release
          path: ${{ runner.temp }}/desktop-release
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-linux-release
          path: ${{ runner.temp }}/desktop-release
      - uses: actions/download-artifact@v7
        with:
          pattern: scimtest-desktop-linux-*-release
          path: ${{ runner.temp }}/desktop-release
          merge-multiple: true
      - name: Publish desktop artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release upload "${GITHUB_REF_NAME}"
          "${RUNNER_TEMP}"/desktop-release/* --clobber
      - name: Update Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dmg_path="${RUNNER_TEMP}/desktop-release/scimtest-desktop_${version}_arm64.dmg"
          dmg_sha256="$(sha256sum "${dmg_path}" | cut -d ' ' -f 1)"
          ./packaging/macos/update-homebrew-cask.sh \
            "${version}" \
            "${dmg_sha256}"
  update-feed:
    name: Sign update feed
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-notes
      - package-desktop
      - package-desktop-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-release-notes
          path: build
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-release
          path: release
      - uses: actions/download-artifact@v7
        with:
          name: scimtest-desktop-linux-release
          path: release
      - uses: actions/download-artifact@v7
        with:
          pattern: scimtest-desktop-linux-*-release
          path: release
          merge-multiple: true
      - name: Sign update feed and legacy Sparkle appcast
        env:
          SIGNING_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "${SIGNING_KEY}" ]]; then
            echo "::error::Set the SPARKLE_EDDSA_PRIVATE_KEY repository secret"
            exit 1
          fi

          version="${RELEASE_VERSION#v}"
          base_url="https://github.com/rselbach/scimtest/releases/download/v${version}"
          published_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          zip="scimtest-desktop_${version}_arm64.zip"
          dmg="scimtest-desktop_${version}_arm64.dmg"
          deb="scimtest-desktop_${version}_linux_amd64.deb"
          rpm="scimtest-desktop_${version}_linux_x86_64.rpm"
          arch="scimtest-desktop_${version}_linux_x86_64.pkg.tar.zst"
          tool=target/release/scimtest-update-tool

          cargo build --release --locked -p scimtest-update-tool
          mkdir -p site
          "${tool}" sign-feed \
            --version "${version}" \
            --build "${GITHUB_RUN_NUMBER}" \
            --published-at "${published_at}" \
            --notes-url "https://github.com/rselbach/scimtest/releases/tag/v${version}" \
            --notes build/release-notes.md \
            --artifact "macos,arm64,app-zip,26.0,release/${zip},${base_url}/${zip}" \
            --artifact "macos,arm64,dmg,26.0,release/${dmg},${base_url}/${dmg}" \
            --artifact "linux,x86_64,deb,0,release/${deb},${base_url}/${deb}" \
            --artifact "linux,x86_64,rpm,0,release/${rpm},${base_url}/${rpm}" \
            --artifact "linux,x86_64,pkg.tar.zst,0,release/${arch},${base_url}/${arch}" \
            --out site/update.json <<<"${SIGNING_KEY}"
          # releases from before the signed feed still update through Sparkle
          "${tool}" appcast \
            --version "${version}" \
            --build "${GITHUB_RUN_NUMBER}" \
            --minimum-os 26.0 \
            --published-at "${published_at}" \
            --archive "release/${zip}" \
            --url "${base_url}/${zip}" \
            --out site/appcast.xml <<<"${SIGNING_KEY}"
      - name: Upload update feeds for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy-appcast:
    name: Publish update feeds
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - release-desktop
      - update-feed
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy update feeds
        id: deployment
        uses: actions/deploy-pages@v5
