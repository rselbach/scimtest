name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-compile checks
        run: |
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=freebsd GOARCH=amd64 go vet ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Validate goreleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          args: check

  desktop-linux:
    name: Linux desktop
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: 1
      PKG_CONFIG: ${{ github.workspace }}/packaging/linux/pkg-config-webkit2gtk-4.1.sh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config \
            xdotool \
            xvfb
      - name: Test desktop shell
        run: go test -tags desktop ./cmd/scimtest-desktop
      - name: Build desktop executable
        run: |
          mkdir -p build
          go build -tags desktop -trimpath \
            -ldflags="-X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID=00000000000000000000000000000000 -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseProfileRequired=true" \
            -o build/scimtest-desktop ./cmd/scimtest-desktop
      - name: Smoke-test desktop window
        run: xvfb-run -a ./packaging/linux/smoke-test.sh ./build/scimtest-desktop
