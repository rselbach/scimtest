name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-core:
    name: Rust services and release tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p scimtest-core -p scimtest-server -p scimtest-protocol -p scimtest-update-tool --all-targets --locked -- -D warnings
      - run: cargo test -p scimtest-core -p scimtest-server -p scimtest-protocol -p scimtest-update-tool --locked

  rust-server-static:
    name: Static Rust server on Linux AMD64
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Test hosted workflows
        run: >-
          cargo test --locked --release --target x86_64-unknown-linux-musl
          -p scimtest-server -p scimtest-protocol
      - name: Test desktop tunnel interoperability
        run: >-
          cargo test --locked --release --target x86_64-unknown-linux-musl
          -p scimtest-core --test tunnel --test connection
      - name: Check standalone static release executable
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl -p scimtest-server
          binary=target/x86_64-unknown-linux-musl/release/scimtest-server
          file "${binary}"
          if readelf -l "${binary}" | grep -q INTERP; then
            echo "::error::Server must not have a dynamic interpreter"
            exit 1
          fi
          if readelf -d "${binary}" | grep -q NEEDED; then
            echo "::error::Server must not depend on shared libraries"
            exit 1
          fi

  rust-desktop:
    name: Rust desktop
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy -p scimtest-desktop --all-targets --locked -- -D warnings
      - run: cargo test -p scimtest-desktop --locked
      - run: cargo build -p scimtest-desktop --locked
