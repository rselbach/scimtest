# Serves the scimtest download page (site/) at https://rselbach.com/scimtest/.
# deploy/deploy-site.sh installs this as /etc/nginx/snippets/scimtest.conf and
# includes it in the rselbach.com server block. `^~` keeps the blog's regex
# locations (image, CSS, and JS caching) from matching anything under /scimtest/.

location = /scimtest {
    # nginx listens on 8000 behind the exe.dev proxy; keep the redirect relative
    absolute_redirect off;
    return 301 /scimtest/;
}

location ^~ /scimtest/ {
    root /var/www;
    index index.html;

    # self, Google Fonts, and the release feed the download button reads
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://rselbach.github.io; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=60, stale-if-error=86400" always;

    try_files $uri $uri/ =404;
}
