version: 2

project_name: scimtest

builds:
  - id: scimtest-server
    main: ./cmd/scimtest-server
    binary: scimtest-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: scimtest-server
    ids:
      - scimtest-server
    formats:
      - tar.gz
    name_template: >-
      scimtest-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
