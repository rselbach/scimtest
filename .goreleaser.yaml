version: 2

project_name: scimtest

builds:
  - id: scimtest
    main: ./cmd/scimtest
    binary: scimtest
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X=main.version={{ .Version }}
      - -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationProfileID={{ .Env.SCIMTEST_APPLICATION_PROFILE_ID }}
      - -X=github.com/rselbach/scimtest/internal/web.tunnelApplicationPrivateSeed={{ .Env.SCIMTEST_APPLICATION_PRIVATE_SEED_BASE64 }}
      - -X=github.com/rselbach/scimtest/internal/web.tunnelReleaseIdentityRequired=true
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
  - id: scimtest-server
    main: ./cmd/scimtest-server
    binary: scimtest-server
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: scimtest
    ids:
      - scimtest
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
  - id: scimtest-server
    ids:
      - scimtest-server
    formats:
      - tar.gz
    name_template: >-
      scimtest-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

homebrew_casks:
  - name: scimtest
    ids:
      - scimtest
    repository:
      owner: rselbach
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/rselbach/scimtest
    description: Local SCIM/OIDC/SAML auth testing service
    license: MIT
    # release binaries are not notarized, so strip the quarantine flag
    # macOS puts on downloaded executables
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/scimtest"]
          end
