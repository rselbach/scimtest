[workspace]
members = ["crates/scimtest-core", "crates/scimtest-desktop", "crates/scimtest-server", "crates/scimtest-protocol", "crates/scimtest-update-tool"]
exclude = ["vendor/tokio-tungstenite"]
resolver = "2"

[patch.crates-io]
tokio-tungstenite = { path = "vendor/tokio-tungstenite" }

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
scimtest-protocol = { path = "crates/scimtest-protocol" }
anyhow = "1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
rune = { git = "https://github.com/anomalyco/rune", rev = "b99c7b04e75c0b7587fe8d09ba6a679e11ede9c9", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "b99c7b04e75c0b7587fe8d09ba6a679e11ede9c9", features = ["markdown"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
x509-parser = "0.18"
libc = "0.2"
rsa = { version = "0.9", features = ["pem", "sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
rcgen = "0.14"
time = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde_urlencoded = "0.7"

httpdate = "1"
bergshamra = { version = "0.11.1", default-features = false, features = ["rustcrypto"] }
flate2 = "1"
aes-gcm = "0.10"
aes = "0.8"
sha1 = "0.10"
regex = "1"
ed25519-dalek = "2.2"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", features = ["sink"] }
percent-encoding = "2"
ipnet = "2"
tokio-socks = "0.5"
tempfile = "3"
